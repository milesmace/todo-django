services:
  web:
    build: .
    command: sh -c "python manage.py test"
    working_dir: /app/src
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

volumes:
  postgres_data:
  static_volume:
  redis-data:
